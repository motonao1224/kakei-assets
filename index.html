<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>家計と制度のメモ</title>
<style>
:root { --bg: #FBFAF7; --ink: #1B1F24; --muted: #5B6470; --card: #FFFFFF; --accent: #2F6FED; --line: #E6E4DE; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 24px; margin: 0 0 6px; }
.tagline { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
h2 { font-size: 14px; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; text-transform: uppercase; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-height: 64px; text-decoration: none; color: inherit; }
a.card:active { background: #F2F6FF; }
a.card .label { font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
a.card .label::after { content: "→"; color: var(--accent); font-weight: 700; }
a.card .note { color: var(--muted); font-size: 14px; margin-top: 4px; }
.pr { display: inline-block; font-size: 11px; font-weight: 700; border: 1.5px solid var(--muted); color: var(--muted); border-radius: 6px; padding: 0 6px; margin-right: 8px; vertical-align: middle; }
footer { margin-top: 36px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>家計と制度のメモ</h1>
  <p class="tagline">新NISA・こどもNISA・ふるさと納税の「手続き」だけをわかりやすく</p>
  
  
  
  
  
  
  <h2>今の季節枠（11〜12 月）</h2>
  <ul>
    
    <li><a class="card" href="https://px.a8.net/svt/ejp?a8mat=4BGAV2+EPADKI+54OC+5YJRM" rel="nofollow sponsored noopener" target="_blank">
      <div class="label"><span><span class="pr">PR</span>ふるさと納税を始める</span></div>
      <div class="note">12/31 決済完了分まで当年の控除</div>
    </a></li>
    
    <li><a class="card" href="https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/furusato/" rel="nofollow sponsored noopener" target="_blank">
      <div class="label"><span>ふるさと納税の仕組み（総務省）</span></div>
      <div class="note">公式の制度説明</div>
    </a></li>
    
  </ul>
  
  
  <footer>当ページのリンクには広告（PR）が含まれます。制度の内容は各公式サイトで最新情報をご確認ください。<br>最終更新: 2026-11-01</footer>
</main>
</body>
</html>
